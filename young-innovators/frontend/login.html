<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Login - Young Innovators</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- Splash Screen -->
  <div id="splashScreen" class="splash-screen">
    <div class="splash-particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    <img src="./logo.png" alt="Young Innovators" class="splash-logo">
    <div class="splash-title">Young Innovators</div>
    <div class="splash-subtitle">Learn, Play &amp; Innovate!</div>
    <div class="splash-loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>


  <nav class="navbar auth-navbar" id="navbar">

    <div class="container">

      <!-- LEFT -->
      <div class="nav-left">

        <a href="index.html" class="navbar-brand">

          <img src="./logo.png" alt="Young Innovators" class="logo-icon">

          <span>Young Innovators</span>

        </a>

      </div>

      <!-- CENTER -->
      <div class="nav-center navbar-links" id="navLinks">

        <a href="index.html">Home</a>

        <a href="about.html">About</a>

        <a href="browse-courses.html">Courses</a>

      </div>

      <!-- RIGHT -->
      <div class="nav-right navbar-actions" id="navActions">

        <a href="register.html" class="btn btn-primary btn-sm">

          Sign Up

        </a>

      </div>

      <!-- MOBILE -->
      <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">

        ☰

      </button>

    </div>

  </nav>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card login-card animate-fadeInUp">
        <div class="auth-header">
          <div class="auth-icon">🔑</div>
          <h2>Welcome Back!</h2>
          <p>Log in to continue your learning adventure</p>
        </div>

        <!-- Login Type Tabs -->
        <div class="tabs" id="loginTabs">

          <button class="tab active" data-type="parent" onclick="switchLoginType('parent')">
            👨‍👩‍👧 Parent
          </button>

          <button class="tab" data-type="student" onclick="switchLoginType('student')">
            🎓 Student
          </button>

          <button class="tab" data-type="provider" onclick="switchLoginType('provider')">
            📚 Provider
          </button>
        </div>

        <div id="alertBox"></div>

        <!-- Parent / Provider / Student Login (Email) -->
        <form id="emailLoginForm" onsubmit="handleEmailLogin(event)">
          <div class="form-group">
            <label>Email or Username</label>
            <input type="text" class="form-control" id="loginEmail" placeholder="Enter email or username" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">

              <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password"
                pattern="^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}$" required>

              <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)"
                aria-label="Show password">

                <i class="fa-solid fa-eye"></i>

              </button>

            </div>
        </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;cursor:pointer">
          <input type="checkbox" style="accent-color:var(--primary)"> Remember me
        </label>
        <a href="#" style="font-size:0.85rem;color:var(--primary);font-weight:600">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Log In →</button>
      </form>

      <!-- Student Login (Username) -->
      <form id="usernameLoginForm" style="display:none" onsubmit="handleStudentLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" id="loginUsername" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">

            <input type="password" class="form-control" id="loginStudentPassword" placeholder="Enter your password"
              required>

            <button type="button" class="toggle-password" onclick="togglePassword('loginStudentPassword', this)"
              aria-label="Show password">

              <i class="fa-solid fa-eye"></i>

            </button>

          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Log In →</button>
      </form>

      <div class="auth-divider">or</div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Sign up here</a>
      </div>
    </div>
  </div>
  </div>

  <script src="./script.js"></script>
  <script src="./security.js"></script>
  <script>
    let currentLoginType = 'parent';

    function switchLoginType(type) {
      currentLoginType = type;
      document.querySelectorAll('#loginTabs .tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-type="${type}"]`).classList.add('active');

      const emailForm = document.getElementById('emailLoginForm');
      const usernameForm = document.getElementById('usernameLoginForm');

      if (type === 'student') {
        emailForm.style.display = 'none';
        usernameForm.style.display = 'block';
      } else {
        emailForm.style.display = 'block';
        usernameForm.style.display = 'none';
      }
      document.getElementById('alertBox').innerHTML = '';
    }

    function togglePassword(inputId, button) {

      const input = document.getElementById(inputId);
      const icon = button.querySelector('i');

      if (input.type === 'password') {

        input.type = 'text';

        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');

      } else {

        input.type = 'password';

        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    async function handleEmailLogin(e) {

      e.preventDefault();

      if (window.Security) {
        const rateCheck = window.Security.checkRateLimit(
          'login',
          5,
          60000
        );

        if (!rateCheck.allowed) {

          document.getElementById('alertBox').innerHTML =
            `<div class="alert alert-error">
          <span>🔒</span>
          Too many login attempts.
          Please wait ${rateCheck.waitTime} seconds.
        </div>`;

          return;
        }
      }

      const email =
        document.getElementById('loginEmail').value.trim();

      const password =
        document.getElementById('loginPassword').value;

      const role =
        currentLoginType;

      try {

        const user = await window.login(
          email,
          password,
          role
        );

        if (!user) {

          document.getElementById('alertBox').innerHTML =
            `<div class="alert alert-error">
          <span>❌</span>
          Invalid email or password.
        </div>`;

          return;
        }

      } catch (err) {

        console.error(err);

        document.getElementById('alertBox').innerHTML =
          `<div class="alert alert-error">
        <span>❌</span>
        Login failed.
      </div>`;
      }
    }

    async function handleStudentLogin(e) {

      e.preventDefault();

      if (window.Security) {

        const rateCheck =
          window.Security.checkRateLimit(
            'student_login',
            5,
            60000
          );

        if (!rateCheck.allowed) {

          document.getElementById('alertBox').innerHTML =
            `<div class="alert alert-error">
          <span>🔒</span>
          Too many login attempts.
          Please wait ${rateCheck.waitTime} seconds.
        </div>`;

          return;
        }
      }

      const username =
        document.getElementById('loginUsername').value.trim();

      const password =
        document.getElementById('loginStudentPassword').value;

      try {

        const user = await window.login(
          username,
          password,
          'student'
        );

        if (!user) {

          document.getElementById('alertBox').innerHTML =
            `<div class="alert alert-error">
          <span>❌</span>
          Invalid username or password.
        </div>`;

          return;
        }

      } catch (err) {

        console.error(err);

        document.getElementById('alertBox').innerHTML =
          `<div class="alert alert-error">
        <span>❌</span>
        Login failed.
      </div>`;
      }
    }
  </script>
  <script src="./splash.js"></script>
</body>

</html>
