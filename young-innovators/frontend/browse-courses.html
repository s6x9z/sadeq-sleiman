  <script src="./script.js"></script>
  <script src="./security.js"></script>

  <script>

    let allCourses = [];

    function filterCourses(subject, btn) {

      document
        .querySelectorAll('.tab')
        .forEach(t => t.classList.remove('active'));

      btn.classList.add('active');

      renderCourses(
        subject === 'all'
          ? allCourses
          : allCourses.filter(
            c => c.subject === subject
          )
      );
    }

    function renderCourses(courses) {

      const grid =
        document.getElementById('coursesGrid');

      if (!courses.length) {

        grid.innerHTML = `
      <div class="card" style="
        padding:24px;
        color:#666;
        border-radius:20px;
        background:white;
      ">
        No courses found.
      </div>
    `;

        return;
      }

      grid.innerHTML = courses.map(course => `

    <div class="course-card card" style="
      overflow:hidden;
      border-radius:24px;
      background:white;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
    ">

      <div style="
        height:220px;
        background:linear-gradient(135deg,#6C63FF,#9D8DFF);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:5rem;
      ">
        🎮
      </div>

      <div style="padding:24px">

        <h3 style="
          font-size:1.5rem;
          margin-bottom:10px;
          color:#222;
        ">
          ${course.title} (ID: ${course.id})
        </h3>

        <p style="
          color:#666;
          margin-bottom:20px;
          font-size:1rem;
        ">
          ${course.subject}
        </p>

        <button
          class="btn btn-primary"
          style="
          width:100%;
          border:none;
          padding:14px;
          border-radius:16px;
          font-weight:700;
          cursor:pointer;
          background:linear-gradient(135deg,#6C63FF,#9D8DFF);
          color:white;
        "
        onclick="enrollCourse(${course.id})"
      >
        📚 Enroll
      </button>

      </div>

    </div>

  `).join('');
    }

    async function loadGeneratedCourses() {

      const result = await apiGet(
        '../backend/api/courses.php?action=list'
      );

      console.log(result);

      if (!result.ok) {
        alert('Failed to load courses');
        return;
      }

      allCourses = result.courses || [];

      renderCourses(allCourses);
    }

    async function enrollCourse(courseId) {
      const result = await apiPost(
        '../backend/api/enrollment.php',
        {
          action: 'enroll',
          course_id: courseId
        }
      );

      if (!result.ok) {
        alert(result.error || 'Enrollment failed');
        return;
      }

      alert('Successfully enrolled!');
    }

    document.addEventListener(
      'DOMContentLoaded',
      loadGeneratedCourses
    );

  </script>

  <script src="./splash.js"></script>
