<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    Young Innovators Chatbot
  </title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

body {
  background: white;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

    /* =========================================
       MAIN PAGE DEMO
    ========================================= */

    .demo-page {

      padding: 60px;
    }

    .demo-card {

      background: white;

      border-radius: 25px;

      padding: 40px;

      max-width: 900px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, .08);
    }

    .demo-card h1 {

      font-size: 42px;

      color: #5f4dee;

      margin-bottom: 20px;
    }

    .demo-card p {

      color: #555;

      line-height: 1.8;

      font-size: 18px;
    }

    /* =========================================
       FLOAT BUTTON
    ========================================= */

    #chatToggle {

      position: fixed;

      right: 25px;
      bottom: 25px;

      width: 70px;
      height: 70px;

      border-radius: 50%;

      background:
        linear-gradient(135deg,
          #7b61ff,
          #9d89ff);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;

      color: white;

      cursor: pointer;

      z-index: 9999;

      box-shadow:
        0 15px 40px rgba(123, 97, 255, .4);

      transition: .3s;
    }

    #chatToggle:hover {

      transform: scale(1.08);
    }

    /* =========================================
       CHAT PANEL
    ========================================= */

 #chatbot {
  position: fixed;
  top: 0;
  left: 0;
  right: auto;

  width: 100%;
  height: 100vh;

  background: white;
  display: flex;
  flex-direction: column;
  z-index: 99999;
}
    #chatbot.active {

      right: 0;
    }

    /* =========================================
       HEADER
    ========================================= */

    .chat-header {

      background:
        linear-gradient(135deg,
          #7b61ff,
          #9d89ff);

      color: white;

      padding: 22px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title {

      display: flex;
      flex-direction: column;
    }

    .chat-title h2 {

      font-size: 24px;
    }

    .chat-title span {

      font-size: 13px;

      opacity: .85;

      margin-top: 5px;
    }

    #closeChat {

      background: transparent;

      border: none;

      color: white;

      font-size: 26px;

      cursor: pointer;
    }

    /* =========================================
       MESSAGES
    ========================================= */

    #messages {

      flex: 1;

      overflow-y: auto;

      padding: 20px;

      background: #f7f7fb;
    }

    .message {

      margin-bottom: 18px;

      display: flex;
    }

    .message.user {

      justify-content: flex-end;
    }

    .bubble {

      max-width: 80%;

      padding: 14px 18px;

      border-radius: 20px;

      line-height: 1.6;

      font-size: 15px;
    }

    .ai .bubble {

      background: white;

      border-bottom-left-radius: 5px;

      box-shadow:
        0 5px 15px rgba(0, 0, 0, .05);
    }

    .user .bubble {

      background:
        linear-gradient(135deg,
          #7b61ff,
          #9d89ff);

      color: white;

      border-bottom-right-radius: 5px;
    }

    /* =========================================
       INPUT AREA
    ========================================= */

    .input-area {

      padding: 15px;

      border-top:
        1px solid #eee;

      display: flex;
      gap: 10px;

      background: white;
    }

    #userInput {

      flex: 1;

      border: 1px solid #ddd;

      border-radius: 15px;

      padding: 14px;

      font-size: 15px;

      outline: none;
    }

    #sendBtn {

      border: none;

      background:
        linear-gradient(135deg,
          #7b61ff,
          #9d89ff);

      color: white;

      padding: 0 22px;

      border-radius: 15px;

      cursor: pointer;

      font-weight: bold;
    }
  </style>

</head>

<body>

  <!-- ========================================= -->
  <!-- CHATBOT -->
  <!-- ========================================= -->

  <div id="chatbot">

    <div class="chat-header">

      <div class="chat-title">

        <h2>
          🤖 AI Assistant
        </h2>

        <span>
          Content Provider Support
        </span>

      </div>
    </div>

    <!-- MESSAGES -->

    <div id="messages">

      <div class="message ai">

        <div class="bubble">
          Hi 👋<br><br>
          Ask me any question and I will help you!
        </div>

      </div>

    </div>

    <!-- INPUT -->

    <div class="input-area">

      <input type="text" id="userInput" placeholder="Ask AI anything...">

      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>

  <!-- ========================================= -->
  <!-- SCRIPT -->
  <!-- ========================================= -->

  <script>

    const toggle =
      document.getElementById(
        "chatToggle"
      );

    const chatbot =
      document.getElementById(
        "chatbot"
      );

    const closeBtn =
      document.getElementById(
        "closeChat"
      );

    const sendBtn =
      document.getElementById(
        "sendBtn"
      );

    const input =
      document.getElementById(
        "userInput"
      );

    const messages =
      document.getElementById(
        "messages"
      );


    /* =========================================
       SEND MESSAGE
    ========================================= */

    async function sendMessage() {

      const text =
        input.value.trim();

      if (!text) return;

      messages.innerHTML += `
        <div class="message user">
          <div class="bubble">
            ${text}
          </div>
        </div>
      `;

      input.value = "";

      messages.scrollTop =
        messages.scrollHeight;

      try {

        const res = await fetch(
          "http://127.0.0.1:5004/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message: text
            })
          }
        );

        const data =
          await res.json();

        messages.innerHTML += `
          <div class="message ai">
            <div class="bubble">
              ${data.reply}
            </div>
          </div>
        `;

        messages.scrollTop =
          messages.scrollHeight;

      } catch (err) {

        messages.innerHTML += `
          <div class="message ai">
            <div class="bubble">
              AI server error.
            </div>
          </div>
        `;

      }

    }

    sendBtn.onclick =
      sendMessage;

    input.addEventListener(
      "keypress",
      e => {

        if (e.key === "Enter") {
          sendMessage();
        }

      }
    );

  </script>

</body>

</html>
