<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Child Chatbot</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
    }

    #chatbot {
      width: 100%;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: linear-gradient(135deg, #7b61ff, #9d89ff);
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title {
      display: flex;
      flex-direction: column;
    }

    .chat-title h2 {
      font-size: 22px;
    }

    .chat-title span {
      font-size: 13px;
      opacity: .85;
      margin-top: 5px;
    }

    #closeChat {
      background: transparent;
      border: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f7f7fb;
    }

    .message {
      margin-bottom: 18px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 20px;
      line-height: 1.6;
      font-size: 15px;
      word-wrap: break-word;
    }

    .ai .bubble {
      background: white;
      border-bottom-left-radius: 5px;
      box-shadow: 0 5px 15px rgba(0,0,0,.05);
    }

    .user .bubble {
      background: linear-gradient(135deg, #7b61ff, #9d89ff);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
      background: white;
    }

    #userInput {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 14px;
      font-size: 15px;
      outline: none;
      min-width: 0;
    }

    #sendBtn {
      border: none;
      background: linear-gradient(135deg, #7b61ff, #9d89ff);
      color: white;
      padding: 0 22px;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="chatbot">
    <div class="chat-header">
      <div class="chat-title">
        <h2>🤖 AI Buddy</h2>
        <span>Child Support</span>
      </div>

      <button id="closeChat" type="button">✕</button>
    </div>

    <div id="messages">
      <div class="message ai">
        <div class="bubble">
          Hi 👋<br><br>
          Ask me any question and I will help you!
        </div>
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask AI anything...">
      <button id="sendBtn" type="button">Send</button>
    </div>
  </div>

  <script>
    const closeBtn = document.getElementById("closeChat");
    const sendBtn = document.getElementById("sendBtn");
    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");

    closeBtn.onclick = () => {

  if (
    window.parent &&
    window.parent.toggleChildBot
  ) {
    window.parent.toggleChildBot();
  }

};

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      messages.innerHTML += `
        <div class="message user">
          <div class="bubble">${escapeHTML(text)}</div>
        </div>
      `;

      input.value = "";
      messages.scrollTop = messages.scrollHeight;

      try {
        const res = await fetch("http://127.0.0.1:5003/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        messages.innerHTML += `
          <div class="message ai">
            <div class="bubble">${escapeHTML(data.reply || "No response")}</div>
          </div>
        `;
      } catch (err) {
        messages.innerHTML += `
          <div class="message ai">
            <div class="bubble">AI server error. Make sure chatbot.py is running.</div>
          </div>
        `;
      }

      messages.scrollTop = messages.scrollHeight;
    }

    sendBtn.onclick = sendMessage;

    input.addEventListener("keypress", e => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
